name: SnapDo
options:
  bundleIdPrefix: com.moonkj.snapdo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"

# SwiftPM dependency: SnapDoCore is a local package consumed by both app and CLI
packages:
  SnapDoCore:
    path: .

targets:
  # ─── iOS App ────────────────────────────────────────────────
  SnapDo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: App/Resources
        excludes:
          - "Info.plist"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 스냅두
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "스냅두는 스크린샷을 자동으로 분류해 받은함에 정리해드려요. 사진은 폰 안에서만 처리됩니다."
        NSPhotoLibraryAddUsageDescription: "처리된 캡처를 사진 라이브러리에 다시 저장할 때 필요합니다."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moonkj.snapdo
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only for V1.0
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SnapDoCore
        product: SnapDoCore

  # ─── macOS Training CLI ─────────────────────────────────────
  SnapDoTrainer:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SnapDoTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moonkj.snapdo.trainer
        SKIP_INSTALL: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: SnapDoCore
        product: SnapDoCore

schemes:
  SnapDo:
    build:
      targets:
        SnapDo: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  SnapDoTrainer:
    build:
      targets:
        SnapDoTrainer: all
    run:
      config: Debug

# Note: SwiftPM unit tests live inside SnapDoCore (Tests/SnapDoCoreTests).
# Run them with `swift test` from the repo root — they are not exposed as Xcode
# schemes because XcodeGen cannot reference SwiftPM testTargets directly.
